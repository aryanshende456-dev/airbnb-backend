<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Home</title>
  <link href="/output.css" rel="stylesheet">
  <link href="/home.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-red-500 text-white p-4 shadow-md">
    <nav class="container mx-auto flex justify-between items-center">
      <ul class="flex space-x-4">
        <li>
          <a href="/"
            class="hover:bg-red-400 py-2 px-4 rounded transition duration-300">Go To Home</a>
        </li>
        <li>
          <a href="/host/add-home"
            class="hover:bg-red-400 py-2 px-4 rounded transition duration-300">Add Home</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto bg-white shadow-lg rounded-lg p-8 mt-10 max-w-xl text-left">
    <h1 class="text-3xl md:text-5xl text-gray-800 font-bold text-center mb-2">
      Register your home here
    </h1>
    <p class="text-lg text-red-700 text-center mb-8">
      Share your place with guests on Airbnb.
    </p>

    <form action="/host/add-home" method="POST" class="space-y-6">
      <div>
        <label for="houseName" class="block text-lg font-bold text-gray-800 mb-2">
          House name
        </label>
        <input
          id="houseName"
          type="text"
          name="houseName"
          placeholder="Enter your house name"
          required
          class="w-full rounded-lg border border-gray-100 bg-gray-100 p-4 text-lg text-gray-800 shadow-md outline-none transition duration-300 focus:border-red-500 focus:ring-2 focus:ring-red-500/30"
        />
      
         <input
          id="price"
          type="number"
          name="price"
          min="1"
          step="1"
          placeholder="$150 per night"
          required
          class="w-full rounded-lg border border-gray-100 bg-gray-100 p-4 text-lg text-gray-800 shadow-md outline-none transition duration-300 focus:border-red-500 focus:ring-2 focus:ring-red-500/30"
        />
                 <input
          id="location"
          type="text"
          name="location"
          placeholder="location"
          required
          class="w-full rounded-lg border border-gray-100 bg-gray-100 p-4 text-lg text-gray-800 shadow-md outline-none transition duration-300 focus:border-red-500 focus:ring-2 focus:ring-red-500/30"
        />
                 <input
          id="rating"
          type="text"
          name="rating"
          placeholder="rating"
          required
          class="w-full rounded-lg border border-gray-100 bg-gray-100 p-4 text-lg text-gray-800 shadow-md outline-none transition duration-300 focus:border-red-500 focus:ring-2 focus:ring-red-500/30"
        />
                 <input
          id="photoUrl"
          type="url"
          name="photoUrl"
          placeholder="https://example.com/photo.jpg"
          required
          class="w-full rounded-lg border border-gray-100 bg-gray-100 p-4 text-lg text-gray-800 shadow-md outline-none transition duration-300 focus:border-red-500 focus:ring-2 focus:ring-red-500/30"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-red-500 text-white font-bold py-3 px-4 rounded-lg transition duration-300 hover:bg-red-400 shadow-md hover:shadow-lg"
      >
        Register home
      </button>
    </form>
  </main>
</body>
</html>
